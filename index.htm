<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Protection Group - Quote Generator</title>
  <!-- Libraries for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --cpg-navy: #0a192f;
      --cpg-dark-blue: #0f2b48;
      --cpg-cyan: #00bcd4;
      --cpg-light-cyan: #64ffda;
      --cpg-text-light: #e6f1ff;
      --cpg-text-muted: #8892b0;
      --cpg-card-bg: rgba(15, 43, 72, 0.6);
      --cpg-border: rgba(100, 255, 218, 0.2);
      --cpg-discount-red: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #020c1b 0%, #0a192f 100%);
      color: var(--cpg-text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .quote-app-container {
      width: 100%;
      max-width: 1200px;
      background: rgba(10, 25, 47, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--cpg-border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 30px;
      margin-top: 20px;
    }

    header {
      border-bottom: 2px solid var(--cpg-cyan);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--cpg-light-cyan);
      letter-spacing: 1px;
    }

    /* Clickable Progress Bar */
    .progress-bar-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .step-badge {
      flex: 1;
      background: var(--cpg-dark-blue);
      border: 1px solid var(--cpg-border);
      color: var(--cpg-text-muted);
      padding: 10px 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .step-badge:hover {
      border-color: var(--cpg-cyan);
      color: var(--cpg-text-light);
    }

    .step-badge.active {
      background: var(--cpg-cyan);
      color: var(--cpg-navy);
      border-color: var(--cpg-light-cyan);
      box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
    }

    /* Pages & Sections */
    .form-page {
      display: none;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    .form-page.active-page {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 1.4rem;
      color: var(--cpg-light-cyan);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Form Fields Grid */
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    .field-group label {
      font-size: 0.85rem;
      color: var(--cpg-text-muted);
      margin-bottom: 6px;
    }

    .field-group input, .field-group select {
      background: rgba(15, 43, 72, 0.8);
      border: 1px solid var(--cpg-border);
      color: var(--cpg-text-light);
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
      transition: border 0.3s ease;
    }

    .field-group input:focus, .field-group select:focus {
      border-color: var(--cpg-cyan);
      box-shadow: 0 0 6px rgba(0, 188, 212, 0.3);
    }

    /* Product Section Discount Controls */
    .page-discount-bar {
      background: rgba(15, 43, 72, 0.9);
      border: 1px dashed var(--cpg-cyan);
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .page-discount-bar span {
      font-size: 0.9rem;
      color: var(--cpg-light-cyan);
      font-weight: 600;
    }

    .discount-options {
      display: flex;
      gap: 12px;
    }

    .discount-options label {
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Data Tables */
    .table-container {
      overflow-x: auto;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--cpg-card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(100, 255, 218, 0.1);
    }

    th {
      background: var(--cpg-dark-blue);
      color: var(--cpg-light-cyan);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: rgba(100, 255, 218, 0.05);
    }

    .qty-input, .price-input {
      width: 80px;
      background: rgba(10, 25, 47, 0.9);
      border: 1px solid var(--cpg-border);
      color: var(--cpg-text-light);
      padding: 6px 10px;
      border-radius: 4px;
      text-align: center;
    }

    .discount-price {
      color: var(--cpg-discount-red);
      font-weight: bold;
    }

    .original-price-strike {
      text-decoration: line-through;
      color: var(--cpg-text-muted);
      font-size: 0.8rem;
      margin-right: 4px;
    }

    /* Buttons & Nav */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .btn-prev {
      background: transparent;
      border: 1px solid var(--cpg-text-muted);
      color: var(--cpg-text-muted);
    }

    .btn-prev:hover {
      border-color: var(--cpg-text-light);
      color: var(--cpg-text-light);
    }

    .btn-next, .btn-submit {
      background: var(--cpg-cyan);
      color: var(--cpg-navy);
      box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
    }

    .btn-next:hover, .btn-submit:hover {
      background: var(--cpg-light-cyan);
      transform: translateY(-2px);
    }

    .btn-test {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid #ffc107;
      color: #ffc107;
    }

    .btn-test:hover {
      background: #ffc107;
      color: #000;
    }

    /* Summary Section */
    .summary-card {
      background: var(--cpg-dark-blue);
      border: 1px solid var(--cpg-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .total-display {
      font-size: 1.5rem;
      color: var(--cpg-light-cyan);
      text-align: right;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="quote-app-container">
  <header>
    <h1>Cyber Protection Group Quote Tool</h1>
  </header>

  <!-- Step Progress Navigation Bar -->
  <div class="progress-bar-container" id="progressBar"></div>

  <form id="quoteForm" onsubmit="event.preventDefault();">
    
    <!-- STEP 1: Customer & Quote Details -->
    <div class="form-page active-page" id="page-1">
      <div class="section-title">
        <span>1. Customer & Quote Information</span>
        <button type="button" class="btn btn-test" onclick="populateTestData()">Inject Test Data</button>
      </div>
      <div class="input-grid">
        <div class="field-group">
          <label for="custCompanyName">Company Name *</label>
          <input type="text" id="custCompanyName" required placeholder="e.g. Acme Cyber Security Ltd">
        </div>
        <div class="field-group">
          <label for="custAttention">Attention / Contact Person</label>
          <input type="text" id="custAttention" placeholder="e.g. John Doe">
        </div>
        <div class="field-group">
          <label for="custPhone">Contact Phone</label>
          <input type="tel" id="custPhone" placeholder="e.g. +44 20 7946 0912">
        </div>
        <div class="field-group">
          <label for="custAddr1">Address Line 1</label>
          <input type="text" id="custAddr1" placeholder="e.g. 100 Bishopsgate">
        </div>
        <div class="field-group">
          <label for="custAddr2">Address Line 2</label>
          <input type="text" id="custAddr2" placeholder="e.g. Suite 400">
        </div>
        <div class="field-group">
          <label for="custCity">City / Town</label>
          <input type="text" id="custCity" placeholder="e.g. London">
        </div>
        <div class="field-group">
          <label for="custPostcode">Postcode</label>
          <input type="text" id="custPostcode" placeholder="e.g. EC2N 4AG">
        </div>
        <div class="field-group">
          <label for="quoteNumber">Quote Number</label>
          <input type="text" id="quoteNumber" value="QU-1001">
        </div>
        <div class="field-group">
          <label for="quoteRef">Quote Reference</label>
          <input type="text" id="quoteRef" value="Ref: CPG-2026-SEC">
        </div>
      </div>
      <div class="nav-buttons">
        <div></div>
        <button type="button" class="btn btn-next" onclick="goToStep(2)">Next: CYBER App &rarr;</button>
      </div>
    </div>

    <!-- DYNAMIC SECTION PAGES 2-7 INJECTED BY JS -->
    <div id="dynamicProductPages"></div>

    <!-- STEP 8: Quote Summary & PDF Export -->
    <div class="form-page" id="page-8">
      <div class="section-title">8. Final Quote Summary & Review</div>
      
      <div class="summary-card">
        <h3>Customer Summary</h3>
        <p id="sumCustomerDetails" style="margin-top: 10px; color: var(--cpg-text-muted);"></p>
      </div>

      <div class="table-container">
        <table id="summaryTable">
          <thead>
            <tr>
              <th>Code</th>
              <th>Classification</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Unit Sell (£)</th>
              <th>Total (£/mo)</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody">
            <!-- Selected Items Injected Here -->
          </tbody>
        </table>
      </div>

      <div class="total-display" id="grandTotalDisplay">
        Grand Total: £0.00 / month
      </div>

      <div class="nav-buttons">
        <button type="button" class="btn btn-prev" onclick="goToStep(7)">&larr; Back</button>
        <button type="button" class="btn btn-submit" onclick="downloadPDF()">Download PDF Quote</button>
      </div>
    </div>

  </form>
</div>

<!-- Invisible Container for PDF Output Generation -->
<div id="quote-pdf-template" style="display:none; padding:30px; background:#fff; color:#000;">
  <h2 id="pdfHeader" style="color:#0a192f; border-bottom:2px solid #00bcd4; padding-bottom:10px;">CPG Official Quote</h2>
  <div id="pdfCustomerInfo" style="margin:20px 0;"></div>
  <table id="pdfTable" style="width:100%; border-collapse:collapse; margin-top:20px;">
    <thead>
      <tr style="background:#0f2b48; color:#fff;">
        <th style="padding:8px; text-align:left;">Code</th>
        <th style="padding:8px; text-align:left;">Description</th>
        <th style="padding:8px; text-align:center;">Qty</th>
        <th style="padding:8px; text-align:right;">Unit Price (£)</th>
        <th style="padding:8px; text-align:right;">Subtotal (£)</th>
      </tr>
    </thead>
    <tbody id="pdfTableBody"></tbody>
  </table>
  <h3 id="pdfGrandTotal" style="text-align:right; margin-top:20px;"></h3>
</div>

  { category: "CYBER Assure", classification: "Policy & Governance Template Suite", code: "CAS-03", supplierPackage: "CPG Governance", supplier: "Cyber Protection Group", minLicenses: 1, buyPrice: 5.00, sellPrice: 20.00, serviceOffering: "Customizable IT security policies, Acceptable Use Policies (AUP), and incident plans.", functionOfProduct: "Security Governance & Compliance Alignment", cyberBenefit: "Establishes clear corporate accountability and employee security rules." },
  { category: "CYBER Assure", classification: "Simulated Phishing Campaign (Quarterly)", code: "CAS-04", supplierPackage: "B-KnowBe4", supplier: "B-KnowBe4", minLicenses: 1, buyPrice: 1.50, sellPrice: 5.00, serviceOffering: "Automated, scheduled phishing simulation tests for staff members.", functionOfProduct: "Employee Threat Readiness Evaluation", cyberBenefit: "Measures baseline employee vulnerability to social engineering." },
  { category: "CYBER Assure", classification: "Executive Security Briefings", code: "CAS-05", supplierPackage: "CPG Advisory", supplier: "Cyber Protection Group", minLicenses: 1, buyPrice: 30.00, sellPrice: 95.00, serviceOffering: "Quarterly risk report briefings for senior leadership and board members.", functionOfProduct: "Board-Level Threat Visibility", cyberBenefit: "Translates technical cyber risk into business risk metrics." },

  { category: "CYBER Assure", classification: "Cyber Security / Awareness Training", code: "CAS-07", supplierPackage: "B-KnowBe4", supplier: "B-KnowBe4", minLicenses: 1, buyPrice: 2.45, sellPrice: 9.00, serviceOffering: "Program to teach employees how to identify and respond to cyber threats.", functionOfProduct: "Equip employees to be the first line of defence against evolving threats.", cyberBenefit: "Cyber hygiene: Reduces breach risk by instilling security-first habits." },

  // --- CYBER Backup ---
  { category: "CYBER Backup", classification: "Office 365 Backup / Gmail", code: "CB-01", supplierPackage: "B-Redstor", supplier: "B-Redstor", minLicenses: 1, buyPrice: 1.65, sellPrice: 2.31, serviceOffering: "Backup of Mail, OneDrive, SharePoint, OneNote, Teams.", functionOfProduct: "Gives control over storage & minimizes cyberattack damage.", cyberBenefit: "Complete cloud data recovery & data exfiltration protection." },

  // --- CYBER Connect ---
  { category: "CYBER Connect", classification: "Secure Gateway Tunneling", code: "CC-01", supplierPackage: "CPG Network", supplier: "Cyber Protection Group", minLicenses: 1, buyPrice: 3.50, sellPrice: 8.50, serviceOffering: "Encrypted secure network tunneling for remote workforces.", functionOfProduct: "Secure Access Gateway", cyberBenefit: "Protects branch office communication and remote sessions." },

  // --- CYBER Defense ---
  { category: "CYBER Defense", classification: "Microsoft Computers", code: "CD-01", supplierPackage: "Cynet Elite", supplier: "Cynet", minLicenses: 1, buyPrice: 4.00, sellPrice: 13.60, serviceOffering: "EPP uses multiple prevention layers to stop ransomware and exploits.", functionOfProduct: "(Next Gen) Anti-Virus Endpoint Detection", cyberBenefit: "Endpoint Detection & Mitigation" },

  { category: "CYBER Defense", classification: "Email Protection", code: "CD-06", supplierPackage: "Cynet Elite", supplier: "Cynet", minLicenses: 1, buyPrice: 2.00, sellPrice: 6.50, serviceOffering: "Email Security filtering and threat inspection.", functionOfProduct: "Email Threat Protection", cyberBenefit: "Spam, Malware, Phishing & Account Takeover Protection" },
  { category: "CYBER Defense", classification: "Ransomware Encryption Protection", code: "CD-08", supplierPackage: "Cynet Elite", supplier: "Cynet", minLicenses: 1, buyPrice: 2.50, sellPrice: 7.50, serviceOffering: "Security measures to prevent or reduce risk of ransomware attacks.", functionOfProduct: "Preventing ransomware occurrence.", cyberBenefit: "Detect, prevent, respond to, and recover from attacks." },
  { category: "CYBER Defense", classification: "DNS Security", code: "CD-09", supplierPackage: "B-Heimdal Security", supplier: "B-Heimdal Security", minLicenses: 1, buyPrice: 0.95, sellPrice: 1.43, serviceOffering: "Protects Domain Name System (DNS) infrastructure.", functionOfProduct: "Defending DNS infrastructure", cyberBenefit: "Blocks dangerous websites, neutralizes botnets." },

  // --- CYBER Scan ---
  { category: "CYBER Scan", classification: "Dark Web Monitoring", code: "CS-01", supplierPackage: "B-Trillion", supplier: "B-Trillion", minLicenses: 1, buyPrice: 1.25, sellPrice: 6.15, serviceOffering: "Proactively scans the Dark Web for compromised business credentials.", functionOfProduct: "Scans dark web for stolen credentials.", cyberBenefit: "Identifies exposed credentials allowing immediate password resets." }
];

const categories = ["CYBER App", "CYBER Assure", "CYBER Backup", "CYBER Connect", "CYBER Defense", "CYBER Scan"];

let currentStep = 1;
let selections = {};
let pageDiscounts = {};

// Initialize application state
function init() {
  cpgProductCatalog.forEach(prod => {
    selections[prod.code] = {
      selected: false,
      qty: 0,
      customSellPrice: prod.sellPrice,
      baseSellPrice: prod.sellPrice,
      buyPrice: prod.buyPrice
    };
  });
  categories.forEach(cat => pageDiscounts[cat] = 0);

  renderProgressBar();
  renderProductPages();
}

// Build clickable progress bar
function renderProgressBar() {
  const container = document.getElementById('progressBar');
  let html = `<div class="step-badge active" id="badge-1" onclick="goToStep(1)">1. Customer</div>`;
  
  categories.forEach((cat, idx) => {
    const stepNum = idx + 2;
    html += `<div class="step-badge" id="badge-${stepNum}" onclick="goToStep(${stepNum})">${stepNum}. ${cat}</div>`;
  });
  
  html += `<div class="step-badge" id="badge-8" onclick="goToStep(8)">8. Summary</div>`;
  container.innerHTML = html;
}

// Render product tables dynamically for each category page
function renderProductPages() {
  const container = document.getElementById('dynamicProductPages');
  let html = '';

  categories.forEach((cat, idx) => {
    const stepNum = idx + 2;
    const catItems = cpgProductCatalog.filter(p => p.category === cat);

    html += `
      <div class="form-page" id="page-${stepNum}">
        <div class="section-title">
          <span>${stepNum}. ${cat}</span>
        </div>

        <!-- Section Level Discount Bar -->
        <div class="page-discount-bar">
          <span>Apply ${cat} Page Discount:</span>
          <div class="discount-options">
            ${[0, 10, 20, 25, 30, 40, 50].map(pct => `
              <label>
                <input type="radio" name="disc_${cat}" value="${pct}" ${pct === 0 ? 'checked' : ''} onchange="applyPageDiscount('${cat}', ${pct})">
                ${pct}%
              </label>
            `).join('')}
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 40px;">Select</th>
                <th>Code</th>
                <th>Protection Classification</th>
                <th>Supplier</th>
                <th style="width: 80px;">Min Qty</th>
                <th style="width: 90px;">Qty</th>
                <th>Buy Price (£)</th>
                <th>Sell Price (£)</th>
              </tr>
            </thead>
            <tbody>
              ${catItems.map(item => {
                const tooltipText = `Service Offering: ${item.serviceOffering}\nFunction: ${item.functionOfProduct}\nCyber Benefit: ${item.cyberBenefit}`;
                return `
                  <tr title="${tooltipText.replace(/"/g, '&quot;')}">
                    <td style="text-align:center;">
                      <input type="checkbox" id="chk-${item.code}" onchange="toggleSelect('${item.code}', this.checked)">
                    </td>
                    <td><strong>${item.code}</strong></td>
                    <td>${item.classification}</td>
                    <td>${item.supplier}</td>
                    <td style="text-align:center;">${item.minLicenses}</td>
                    <td>
                      <input type="number" class="qty-input" id="qty-${item.code}" value="0" min="0" oninput="handleQtyChange('${item.code}', this.value)">
                    </td>
                    <td>£${item.buyPrice.toFixed(2)}</td>
                    <td>
                      <div id="priceDisplay-${item.code}">
                        <input type="number" step="0.01" class="price-input" id="sell-${item.code}" value="${item.sellPrice.toFixed(2)}" onchange="handleSellPriceChange('${item.code}', this.value)">
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>

        <div class="nav-buttons">
          <button type="button" class="btn btn-prev" onclick="goToStep(${stepNum - 1})">&larr; Back</button>
          <button type="button" class="btn btn-next" onclick="goToStep(${stepNum + 1})">Next Section &rarr;</button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

// Navigation Handler
function goToStep(stepNum) {
  if (stepNum < 1 || stepNum > 8) return;

  // Validate Step 1 if moving forward
  if (currentStep === 1 && stepNum > 1) {
    const comp = document.getElementById('custCompanyName');
    if (!comp.checkValidity()) {
      comp.reportValidity();
      return;
    }
  }

  document.querySelectorAll('.form-page').forEach(p => p.classList.remove('active-page'));
  document.querySelectorAll('.step-badge').forEach(b => b.classList.remove('active'));

  document.getElementById(`page-${stepNum}`).classList.add('active-page');
  document.getElementById(`badge-${stepNum}`).classList.add('active');

  currentStep = stepNum;

  if (stepNum === 8) {
    renderSummary();
  }
}

// Checkbox selection & quantity synchronization
function toggleSelect(code, isChecked) {
  selections[code].selected = isChecked;
  const qtyInput = document.getElementById(`qty-${code}`);

  if (isChecked && parseInt(qtyInput.value) === 0) {
    const prod = cpgProductCatalog.find(p => p.code === code);
    qtyInput.value = prod.minLicenses || 1;
    selections[code].qty = prod.minLicenses || 1;
  }
}

function handleQtyChange(code, val) {
  const qty = parseInt(val) || 0;
  selections[code].qty = qty;

  const chk = document.getElementById(`chk-${code}`);
  if (qty > 0) {
    chk.checked = true;
    selections[code].selected = true;
  }
}

// Price Modification Guardrail (Max 50% discount off base)
function handleSellPriceChange(code, val) {
  const newPrice = parseFloat(val);
  const basePrice = selections[code].baseSellPrice;
  const minAllowed = basePrice * 0.50;

  if (isNaN(newPrice) || newPrice < minAllowed) {
    alert(`Discount Guardrail: Selling price for ${code} cannot be lowered below £${minAllowed.toFixed(2)} (max 50% discount).`);
    document.getElementById(`sell-${code}`).value = selections[code].customSellPrice.toFixed(2);
    return;
  }
  selections[code].customSellPrice = newPrice;
}

// Apply Section Level Discounts
function applyPageDiscount(category, discountPct) {
  pageDiscounts[category] = discountPct;
  const catItems = cpgProductCatalog.filter(p => p.category === category);

  catItems.forEach(item => {
    const base = item.sellPrice;
    const discounted = base * (1 - discountPct / 100);
    selections[item.code].customSellPrice = discounted;

    const priceDisplay = document.getElementById(`priceDisplay-${item.code}`);
    if (priceDisplay) {
      if (discountPct > 0) {
        priceDisplay.innerHTML = `
          <span class="original-price-strike">£${base.toFixed(2)}</span>
          <span class="discount-price">£${discounted.toFixed(2)}</span>
        `;
      } else {
        priceDisplay.innerHTML = `
          <input type="number" step="0.01" class="price-input" id="sell-${item.code}" value="${base.toFixed(2)}" onchange="handleSellPriceChange('${item.code}', this.value)">
        `;
      }
    }
  });
}

// Compile & Render Summary
function renderSummary() {
  const company = document.getElementById('custCompanyName').value;
  const attn = document.getElementById('custAttention').value;
  const phone = document.getElementById('custPhone').value;

  document.getElementById('sumCustomerDetails').innerHTML = `
    <strong>${company}</strong> | Attn: ${attn || 'N/A'} | Phone: ${phone || 'N/A'}<br>
    Quote No: ${document.getElementById('quoteNumber').value} | Ref: ${document.getElementById('quoteRef').value}
  `;

  const tbody = document.getElementById('summaryTableBody');
  tbody.innerHTML = '';
  let grandTotal = 0;

  cpgProductCatalog.forEach(item => {
    const sel = selections[item.code];
    if (sel.selected && sel.qty > 0) {
      const lineTotal = sel.qty * sel.customSellPrice;
      grandTotal += lineTotal;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${item.code}</strong></td>
        <td>${item.classification}</td>
        <td>${item.category}</td>
        <td>${sel.qty}</td>
        <td>£${sel.customSellPrice.toFixed(2)}</td>
        <td>£${lineTotal.toFixed(2)}</td>
      `;
      tbody.appendChild(row);
    }
  });

  document.getElementById('grandTotalDisplay').innerText = `Grand Total: £${grandTotal.toFixed(2)} / month`;
}

// Export Quote to PDF formatted as [Customer Name] [Quote Number].pdf
function downloadPDF() {
  const compName = document.getElementById('custCompanyName').value || "Customer";
  const quoteNum = document.getElementById('quoteNumber').value || "QU-1001";
  const filename = `${compName} ${quoteNum}.pdf`;

  // Populate hidden PDF structure
  document.getElementById('pdfCustomerInfo').innerHTML = `
    <p><strong>Customer:</strong> ${compName}</p>
    <p><strong>Attention:</strong> ${document.getElementById('custAttention').value}</p>
    <p><strong>Quote No:</strong> ${quoteNum} | <strong>Ref:</strong> ${document.getElementById('quoteRef').value}</p>
  `;

  const pdfTbody = document.getElementById('pdfTableBody');
  pdfTbody.innerHTML = '';
  let total = 0;

  cpgProductCatalog.forEach(item => {
    const sel = selections[item.code];
    if (sel.selected && sel.qty > 0) {
      const lineTotal = sel.qty * sel.customSellPrice;
      total += lineTotal;

      const row = document.createElement('tr');
      row.style.borderBottom = "1px solid #ddd";
      row.innerHTML = `
        <td style="padding:8px;">${item.code}</td>
        <td style="padding:8px;">${item.classification}</td>
        <td style="padding:8px; text-align:center;">${sel.qty}</td>
        <td style="padding:8px; text-align:right;">£${sel.customSellPrice.toFixed(2)}</td>
        <td style="padding:8px; text-align:right;">£${lineTotal.toFixed(2)}</td>
      `;
      pdfTbody.appendChild(row);
    }
  });

  document.getElementById('pdfGrandTotal').innerText = `Total Monthly Investment: £${total.toFixed(2)}`;

  const pdfElement = document.getElementById('quote-pdf-template');
  pdfElement.style.display = 'block';

  const opt = {
    margin:       0.5,
    filename:     filename,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(pdfElement).save().then(() => {
    pdfElement.style.display = 'none';
  });
}
