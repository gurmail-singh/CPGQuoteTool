<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPG Quote Tool - Cyber Protection Group</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a192f;
      --card-bg: rgba(16, 30, 54, 0.65);
      --card-border: rgba(100, 255, 218, 0.15);
      --accent: #64ffda;
      --accent-hover: #4cdbba;
      --text-main: #e6f1ff;
      --text-muted: #8892b0;
      --danger: #ff4d4d;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(10, 25, 47, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 { font-size: 1.6rem; color: var(--accent); letter-spacing: 1px; }

    /* Progress Indicator Bar */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      background: rgba(16, 30, 54, 0.8);
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
    }

    .step-indicator {
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .step-indicator.active {
      background: rgba(100, 255, 218, 0.15);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 20px auto;
      padding: 0 20px;
      flex: 1;
    }

    .form-step {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .form-step.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(8px);
      margin-bottom: 20px;
    }

    h2 { color: var(--accent); margin-bottom: 16px; font-weight: 500; }

    /* Form Styles */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--text-muted); }
    input, select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Category Controls & Discount Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .discount-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Product Data Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
    }

    th { background: rgba(255, 255, 255, 0.03); color: var(--accent); }
    th.sell-header-grey { color: #8892b0 !important; }
    th.disc-header-red { color: var(--danger) !important; }

    .tooltip-icon {
      cursor: help;
      display: inline-block;
      margin-left: 6px;
      background: rgba(100, 255, 218, 0.2);
      color: var(--accent);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      text-align: center;
      line-height: 16px;
      font-size: 0.75rem;
    }

    .price-na {
      color: var(--text-muted);
      font-style: italic;
    }

    .price-grey {
      color: #8892b0;
    }

    .price-discounted {
      color: var(--danger);
      font-weight: bold;
    }

    /* Controls & Buttons */
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover { background: rgba(100, 255, 218, 0.1); }
    .btn-primary { background: var(--accent); color: var(--bg-dark); }
    .btn-primary:hover { background: var(--accent-hover); }

    .qty-input { width: 70px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>CPG QUOTE TOOL</h1>
  </header>

  <!-- Step Navigation Header -->
  <div class="progress-bar">
    <div class="step-indicator active" onclick="goToStep(1)">1. Customer Info</div>
    <div class="step-indicator" onclick="goToStep(2)">2. CYBER App</div>
    <div class="step-indicator" onclick="goToStep(3)">3. CYBER Assure</div>
    <div class="step-indicator" onclick="goToStep(4)">4. CYBER Backup</div>
    <div class="step-indicator" onclick="goToStep(5)">5. CYBER Connect</div>
    <div class="step-indicator" onclick="goToStep(6)">6. CYBER Defense</div>
    <div class="step-indicator" onclick="goToStep(7)">7. Cyber Scan</div>
    <div class="step-indicator" onclick="goToStep(8)">8. Summary & Export</div>
  </div>

  <div class="container">

    <!-- Step 1: Customer Details -->
    <div class="form-step active" id="step-1">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Customer Details</h2>
          <button type="button" class="btn" onclick="populateTestData()">Test Data</button>
        </div>
        <div class="form-grid" style="margin-top:15px;">
          <div class="form-group">
            <label>Quote Number</label>
            <input type="text" id="quoteNumber" value="CPG-2026-1001">
          </div>
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="companyName" placeholder="Acme Ltd">
          </div>
          <div class="form-group">
            <label>Contact Name</label>
            <input type="text" id="contactName" placeholder="John Smith">
          </div>
          <div class="form-group">
            <label>Contact Email</label>
            <input type="email" id="contactEmail" placeholder="john@acme.com">
          </div>
        </div>
      </div>
      <div class="btn-group">
        <div></div>
        <button class="btn btn-primary" onclick="goToStep(2)">Next: CYBER App &rarr;</button>
      </div>
    </div>

    <!-- Category Step Template Container (Rendered dynamically) -->
    <div id="categoryStepsContainer"></div>

    <!-- Step 8: Final Review & PDF Export -->
    <div class="form-step" id="step-8">
      <div class="card">
        <h2>Quote Summary</h2>
        <div id="quoteSummaryOutput"></div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="goToStep(7)">&larr; Back</button>
        <button class="btn btn-primary" onclick="downloadQuotePDF()">Download PDF Quote</button>
      </div>
    </div>

  </div>

<script>
  // Product Master Catalog
  const cpgProductCatalog = [
    // CYBER App
    { category: 'CYBER App', code: 'CA-01', classification: 'Apple Endpoint Protection', supplier: 'Cynet', buyPrice: 3.16, sellPrice: 10.00, serviceOffering: 'Endpoint Mobile Security', functionOfProduct: 'Monitor and remove harmful software on iOS', cyberBenefit: 'Device, Network, Apps & Phishing Threat Detection' },
    { category: 'CYBER App', code: 'CA-02 (a)', classification: 'Android Endpoint Protection', supplier: 'Cynet', buyPrice: 3.16, sellPrice: 10.00, serviceOffering: 'Endpoint Mobile Security', functionOfProduct: 'Monitor and remove harmful software on Android', cyberBenefit: 'Device, Network, Apps & Phishing Threat Detection' },

    // CYBER Assure
    { category: 'CYBER Assure', code: 'CAS-07', classification: 'Cyber Security / Awareness Training', supplier: 'B-KnowBe4', buyPrice: 2.45, sellPrice: 9.00, serviceOffering: 'Security Training', functionOfProduct: 'Equip employees to be the first line of defence', cyberBenefit: 'Practice good cybersecurity habits and reduce breach risks' },

    // CYBER Backup
    { category: 'CYBER Backup', code: 'CB-01', classification: 'Office 365 Backup / Gmail', supplier: 'B-Redstor', buyPrice: 1.65, sellPrice: 2.31, serviceOffering: 'Backup of Mail, OneDrive, SharePoint, OneNote, Teams', functionOfProduct: 'Gives control over all storage and controls exfiltration', cyberBenefit: 'Backup of Mail, OneDrive, SharePoint, OneNote, Teams' },
    { category: 'CYBER Backup', code: 'CB-02', classification: 'Backup Product CB-02', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-03', classification: 'Backup Product CB-03', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-04', classification: 'Backup Product CB-04', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-05', classification: 'Backup Product CB-05', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-06', classification: 'Backup Product CB-06', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-07', classification: 'Backup Product CB-07', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-08', classification: 'Backup Product CB-08', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-09', classification: 'Backup Product CB-09', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-10', classification: 'Backup Product CB-10', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-11', classification: 'Backup Product CB-11', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },
    { category: 'CYBER Backup', code: 'CB-12', classification: 'Backup Product CB-12', supplier: 'Pending', buyPrice: null, sellPrice: null, serviceOffering: 'Pending Data', functionOfProduct: 'Pending Data', cyberBenefit: 'Pending Data' },

    // CYBER Defense
    { category: 'CYBER Defense', code: 'CD-01', classification: 'Microsoft Computers', supplier: 'Cynet', buyPrice: 2.96, sellPrice: 8.60, serviceOffering: 'Cynet EPP', functionOfProduct: '(Next Gen) Anti-Virus Endpoint Detection', cyberBenefit: 'Automatically stop ransomware, fileless malware, and exploits' },
    { category: 'CYBER Defense', code: 'CD-04', classification: 'Remote Desktop', supplier: 'B-Heimdal Security', buyPrice: 0.60, sellPrice: 2.50, serviceOffering: 'Remote Desktop Security', functionOfProduct: 'Secures remote access connections', cyberBenefit: 'Protects remote desktop access endpoints' },
    { category: 'CYBER Defense', code: 'CD-06', classification: 'Email Protection', supplier: 'B-Heimdal Security', buyPrice: 1.39, sellPrice: 2.10, serviceOffering: 'Email Security', functionOfProduct: 'Technologies to prevent and detect email cyber-attacks', cyberBenefit: 'Spam, Malware, Phishing & Impersonation Protection' },
    { category: 'CYBER Defense', code: 'CD-08', classification: 'Ransomware Encryption Protection', supplier: 'Cynet', buyPrice: null, sellPrice: null, serviceOffering: 'Ransomware Protection', functionOfProduct: 'Preventing ransomware events', cyberBenefit: 'Detect, prevent, respond to, and recover from ransomware' },
    { category: 'CYBER Defense', code: 'CD-09', classification: 'DNS Security', supplier: 'B-Heimdal Security', buyPrice: 0.95, sellPrice: 1.43, serviceOffering: 'DNS Infrastructure Protection', functionOfProduct: 'Defending DNS infrastructure from cyberattacks', cyberBenefit: 'Blocks dangerous websites and neutralizes botnet threats' },

    // Cyber Scan
    { category: 'Cyber Scan', code: 'CS-01', classification: 'Dark Web Monitoring', supplier: 'B-Trillion', buyPrice: 1.25, sellPrice: 6.15, serviceOffering: 'Dark Web Monitoring', functionOfProduct: 'Scans the dark web for compromised credentials', cyberBenefit: 'Alerts on leaked credentials for prompt remediation' }
  ];

  const categories = ['CYBER App', 'CYBER Assure', 'CYBER Backup', 'CYBER Connect', 'CYBER Defense', 'Cyber Scan'];
  let pageDiscounts = {};
  let productSelections = {};

  // Initialize Data Matrix
  cpgProductCatalog.forEach(prod => {
    productSelections[prod.code] = {
      selected: false,
      qty: 0,
      customSellPrice: prod.sellPrice,
      baseSellPrice: prod.sellPrice,
      buyPrice: prod.buyPrice,
      isAvailable: prod.sellPrice !== null && prod.sellPrice !== undefined
    };
  });

  // Render Step Views for Categories
  function renderCategorySteps() {
    const container = document.getElementById('categoryStepsContainer');
    let html = '';

    categories.forEach((cat, index) => {
      const stepNum = index + 2;
      const catProducts = cpgProductCatalog.filter(p => p.category === cat);
      const hasDisc = (pageDiscounts[cat] || 0) > 0;

      html += `
        <div class="form-step" id="step-${stepNum}">
          <div class="card">
            <div class="section-header">
              <h2>${cat}</h2>
              <div class="discount-picker">
                <label>Page Discount:</label>
                <select id="discount-select-${stepNum}" onchange="applyPageDiscount('${cat}', this.value)">
                  <option value="0">0%</option>
                  <option value="10">10%</option>
                  <option value="20">20%</option>
                  <option value="25">25%</option>
                  <option value="30">30%</option>
                  <option value="40">40%</option>
                  <option value="50">50%</option>
                </select>
              </div>
            </div>

            <table id="table-cat-${stepNum}">
              <thead>
                <tr>
                  <th>Select</th>
                  <th>Classification</th>
                  <th>Code</th>
                  <th>Supplier</th>
                  <th>Buy Price</th>
                  <th id="th-sell-${stepNum}" class="${hasDisc ? 'sell-header-grey' : ''}">CPG Sell Price (£)</th>
                  ${hasDisc ? `<th id="th-disc-${stepNum}" class="disc-header-red">CPG Discounted Price (£)</th>` : ''}
                  <th>Qty</th>
                </tr>
              </thead>
              <tbody>`;

      if (catProducts.length === 0) {
        const colSpan = hasDisc ? 8 : 7;
        html += `<tr><td colspan="${colSpan}" style="text-align:center; color:var(--text-muted);">No products currently loaded for ${cat}.</td></tr>`;
      } else {
        catProducts.forEach(item => {
          const tooltip = `Service Offering: ${item.serviceOffering}\nFunction: ${item.functionOfProduct}\nCyber Benefit: ${item.cyberBenefit}`;
          const isAvail = item.sellPrice !== null && item.sellPrice !== undefined;
          const isTicked = productSelections[item.code].selected;
          const buyPriceStr = item.buyPrice !== null ? `£${item.buyPrice.toFixed(2)}` : '<span class="price-na">n/a</span>';
          
          let sellPriceStr = '<span class="price-na">n/a</span>';
          if (isAvail) {
            sellPriceStr = hasDisc && isTicked ? `<span class="price-grey">£${item.sellPrice.toFixed(2)}</span>` : `£${item.sellPrice.toFixed(2)}`;
          }

          let discTd = '';
          if (hasDisc) {
            if (isAvail && isTicked) {
              const discounted = item.sellPrice * (1 - (pageDiscounts[cat] / 100));
              discTd = `<td id="disc-cell-${item.code}" class="price-discounted">£${discounted.toFixed(2)}</td>`;
            } else {
              discTd = `<td id="disc-cell-${item.code}" style="color:#8892b0; text-align:center;">-</td>`;
            }
          }

          html += `
            <tr id="row-${item.code}" style="${!isAvail ? 'opacity: 0.55;' : ''}">
              <td><input type="checkbox" id="chk-${item.code}" ${!isAvail ? 'disabled' : ''} ${isTicked ? 'checked' : ''} onchange="toggleSelect('${item.code}', this.checked)"></td>
              <td>${item.classification} <span class="tooltip-icon" title="${tooltip}">?</span></td>
              <td>${item.code}</td>
              <td>${item.supplier}</td>
              <td>${buyPriceStr}</td>
              <td id="price-cell-${item.code}">${sellPriceStr}</td>
              ${discTd}
              <td><input type="number" class="qty-input" min="0" value="${productSelections[item.code].qty}" id="qty-${item.code}" ${!isAvail ? 'disabled' : ''} oninput="updateQty('${item.code}', this.value)"></td>
            </tr>`;
        });
      }

      html += `
              </tbody>
            </table>
          </div>

          <div class="btn-group">
            <button class="btn" onclick="goToStep(${stepNum - 1})">&larr; Previous</button>
            <button class="btn btn-primary" onclick="goToStep(${stepNum + 1})">Next &rarr;</button>
          </div>
        </div>`;
    });

    container.innerHTML = html;
  }

  // Auto-Select Checkbox when Qty > 0
  function updateQty(code, value) {
    if (!productSelections[code].isAvailable) return;
    const qty = parseInt(value) || 0;
    productSelections[code].qty = qty;

    if (qty > 0) {
      productSelections[code].selected = true;
      const chk = document.getElementById(`chk-${code}`);
      if (chk) chk.checked = true;
    }

    const item = cpgProductCatalog.find(p => p.code === code);
    if (item) applyPageDiscount(item.category, pageDiscounts[item.category] || 0);
  }

  // Decoupled Checkbox Toggle (Does not reset quantity to 0 when unticked)
  function toggleSelect(code, isChecked) {
    if (!productSelections[code].isAvailable) return;
    productSelections[code].selected = isChecked;
    
    if (isChecked && productSelections[code].qty === 0) {
      productSelections[code].qty = 1;
      const qtyInput = document.getElementById(`qty-${code}`);
      if (qtyInput) qtyInput.value = 1;
    }

    const item = cpgProductCatalog.find(p => p.code === code);
    if (item) applyPageDiscount(item.category, pageDiscounts[item.category] || 0);
  }

  // Handle Page Level Discounts (Applied STRICTLY to ticked rows)
  function applyPageDiscount(cat, discountPct) {
    const pct = parseFloat(discountPct) || 0;
    pageDiscounts[cat] = pct;

    const catIdx = categories.indexOf(cat);
    if (catIdx === -1) return;
    const stepNum = catIdx + 2;

    const table = document.getElementById(`table-cat-${stepNum}`);
    if (!table) return;

    const hasDiscount = pct > 0;
    let sellHeader = document.getElementById(`th-sell-${stepNum}`);
    let discHeader = document.getElementById(`th-disc-${stepNum}`);

    // Manage Discount Column Header Addition/Removal
    if (hasDiscount) {
      if (sellHeader) sellHeader.classList.add('sell-header-grey');
      if (!discHeader && sellHeader) {
        discHeader = document.createElement('th');
        discHeader.id = `th-disc-${stepNum}`;
        discHeader.className = 'disc-header-red';
        discHeader.textContent = 'CPG Discounted Price (£)';
        sellHeader.insertAdjacentElement('afterend', discHeader);
      }
    } else {
      if (sellHeader) sellHeader.classList.remove('sell-header-grey');
      if (discHeader) discHeader.remove();
    }

    // Update Product Rows based on Ticked state
    const catProducts = cpgProductCatalog.filter(p => p.category === cat);
    catProducts.forEach(item => {
      const isAvail = item.sellPrice !== null && item.sellPrice !== undefined;
      const isTicked = productSelections[item.code].selected;
      
      const priceCell = document.getElementById(`price-cell-${item.code}`);
      let discCell = document.getElementById(`disc-cell-${item.code}`);

      if (!isAvail) return;

      if (hasDiscount) {
        if (isTicked) {
          const discounted = item.sellPrice * (1 - pct / 100);
          productSelections[item.code].customSellPrice = discounted;

          if (priceCell) priceCell.innerHTML = `<span class="price-grey">£${item.sellPrice.toFixed(2)}</span>`;

          if (!discCell && priceCell) {
            discCell = document.createElement('td');
            discCell.id = `disc-cell-${item.code}`;
            discCell.className = 'price-discounted';
            discCell.innerText = `£${discounted.toFixed(2)}`;
            priceCell.insertAdjacentElement('afterend', discCell);
          } else if (discCell) {
            discCell.className = 'price-discounted';
            discCell.style.textAlign = 'left';
            discCell.innerText = `£${discounted.toFixed(2)}`;
          }
        } else {
          productSelections[item.code].customSellPrice = item.sellPrice;

          if (priceCell) priceCell.innerText = `£${item.sellPrice.toFixed(2)}`;

          if (!discCell && priceCell) {
            discCell = document.createElement('td');
            discCell.id = `disc-cell-${item.code}`;
            discCell.style.color = '#8892b0';
            discCell.style.textAlign = 'center';
            discCell.innerText = '-';
            priceCell.insertAdjacentElement('afterend', discCell);
          } else if (discCell) {
            discCell.className = '';
            discCell.style.color = '#8892b0';
            discCell.style.textAlign = 'center';
            discCell.innerText = '-';
          }
        }
      } else {
        productSelections[item.code].customSellPrice = item.sellPrice;
        if (priceCell) priceCell.innerText = `£${item.sellPrice.toFixed(2)}`;
        if (discCell) discCell.remove();
      }
    });
  }

  // Step Navigation Engine
  function goToStep(stepNum) {
    document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
    document.querySelectorAll('.step-indicator').forEach((ind, idx) => {
      if (idx + 1 === stepNum) ind.classList.add('active');
      else ind.classList.remove('active');
    });

    const target = document.getElementById(`step-${stepNum}`);
    if (target) target.classList.add('active');

    if (stepNum === 8) renderSummary();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Autofill Demo Information
  function populateTestData() {
    document.getElementById('companyName').value = "Cyber Protection Group Partner";
    document.getElementById('contactName').value = "Alex Turner";
    document.getElementById('contactEmail').value = "alex.turner@cpg-example.co.uk";
  }

  // Build Summary View
  function renderSummary() {
    const compName = document.getElementById('companyName').value || 'N/A';
    const quoteNum = document.getElementById('quoteNumber').value || 'N/A';

    let html = `<p><strong>Company:</strong> ${compName} | <strong>Quote Ref:</strong> ${quoteNum}</p><br>`;
    html += `<table><thead><tr><th>Product Code</th><th>Description</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead><tbody>`;

    let total = 0;
    Object.keys(productSelections).forEach(code => {
      const item = productSelections[code];
      if (item.selected && item.qty > 0 && item.isAvailable) {
        const prod = cpgProductCatalog.find(p => p.code === code);
        const subtotal = item.qty * item.customSellPrice;
        total += subtotal;

        html += `
          <tr>
            <td>${code}</td>
            <td>${prod ? prod.classification : ''}</td>
            <td>${item.qty}</td>
            <td>£${item.customSellPrice.toFixed(2)}</td>
            <td>£${subtotal.toFixed(2)}</td>
          </tr>`;
      }
    });

    html += `</tbody></table><h3 style="margin-top:15px; text-align:right; color:var(--accent);">Total: £${total.toFixed(2)} / mo</h3>`;
    document.getElementById('quoteSummaryOutput').innerHTML = html;
  }

  // PDF Export Engine
  function downloadQuotePDF() {
    const compName = document.getElementById('companyName').value || 'Customer';
    const quoteNum = document.getElementById('quoteNumber').value || 'QU-1001';
    const filename = `${compName} ${quoteNum}.pdf`;

    const element = document.getElementById('quoteSummaryOutput');
    const opt = {
      margin:       0.5,
      filename:     filename,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }

  // Document Ready Initialization
  document.addEventListener('DOMContentLoaded', () => {
    renderCategorySteps();
  });
</script>

</body>
</html>
