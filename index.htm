<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPG Quote Tool</title>
  <!-- html2pdf.js for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a192f;
      --card-bg: #112240;
      --text-main: #e6f1ff;
      --text-muted: #8892b0;
      --accent-blue: #0056b3;
      --accent-hover: #004494;
      --accent-cyan: #64ffda;
      --discount-red: #ff4d4d;
      --border-color: #233554;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    /* Page Step Indicator */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      overflow-x: auto;
    }

    .step-item {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 12px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .step-item.active {
      color: var(--accent-cyan);
      background: rgba(100, 255, 218, 0.1);
      font-weight: bold;
    }

    /* Form Page Dynamic Visibility & Transitions */
    .form-page {
      display: none;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .form-page.active-page {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    h2 {
      color: var(--accent-cyan);
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* Form Controls */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-cyan);
    }

    /* Table Styling */
    .table-responsive {
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .product-table, .summary-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .product-table th, .summary-table th {
      background: var(--bg-dark);
      color: var(--text-muted);
      padding: 12px;
      border-bottom: 2px solid var(--border-color);
      font-weight: 600;
    }

    .product-table td, .summary-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .product-name-hover {
      cursor: help;
      text-decoration: underline dotted var(--text-muted);
    }

    /* Inputs inside tables */
    .product-table input[type="number"],
    .product-table input[type="text"] {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 4px;
      width: 100%;
      max-width: 110px;
    }

    .product-table input.readonly-price {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Checkbox styling */
    .product-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-cyan);
    }

    /* Discount Control Box */
    .discount-box {
      background: var(--bg-dark);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .discount-box p {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .radio-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .radio-group label {
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .radio-group input[type="radio"] {
      accent-color: var(--accent-cyan);
    }

    /* Buttons & Actions */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-prev {
      background: var(--border-color);
      color: var(--text-main);
    }

    .btn-prev:hover {
      background: #32476b;
    }

    .btn-next, .btn-action {
      background: var(--accent-cyan);
      color: var(--bg-dark);
    }

    .btn-next:hover, .btn-action:hover {
      background: #52e0c4;
    }

    .btn-test-data {
      background: #ff9f43;
      color: #fff;
      margin-bottom: 20px;
    }

    .btn-test-data:hover {
      background: #ee8f32;
    }

    /* Summary Specifics */
    .summary-totals {
      float: right;
      width: 300px;
      margin-top: 20px;
      background: var(--bg-dark);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .summary-totals p {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .summary-totals p.total-row {
      border-top: 2px solid var(--border-color);
      padding-top: 8px;
      font-weight: bold;
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    /* Modal for PDF Preview */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: #333;
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 8px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: #333;
    }

    .pdf-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Step Progress Indicator -->
  <div class="step-indicator" id="step-indicator"></div>

  <div id="dynamic-pages-container"></div>
</div>

<!-- PDF Preview Modal -->
<div id="pdf-modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="pdf-preview-target"></div>
    <div class="pdf-actions">
      <button class="btn btn-action" onclick="downloadPDF()">Download PDF</button>
    </div>
  </div>
</div>

<script>
// CPG Master Data compiled from CPG Products2 spreadsheet (master tab)[cite: 1, 2]
// Highest price version retained when duplicate codes exist[cite: 1].
const cpgMasterProducts = [
  // CYBER App[cite: 1, 2, 3]
  { category: "CYBER App", class: "Mobile Phone Protection", supplier: "Supplier A", code: "CA01", buyPrice: 5.00, sellPrice: 10.00, colK: "Functions: Mobile Phone Scan", colL: "Capabilities: Threat hunting", colM: "Customer Benefit: Stops device infection" },
  { category: "CYBER App", class: "DNS Protection", supplier: "Sendmarc", code: "CD08", buyPrice: 30.00, sellPrice: 58.00, colK: "Functions: DMARC monitoring", colL: "Capabilities: Anti-spoofing", colM: "Customer Benefit: Protects domain reputation" },
  
  // CYBER Assure[cite: 1, 2, 3]
  { category: "CYBER Assure", class: "Endpoint Security EDR", supplier: "Supplier B", code: "CAS-01", buyPrice: 4.00, sellPrice: 8.33, colK: "Functions: Next-Gen AV / EDR", colL: "Capabilities: Automated threat detection", colM: "Customer Benefit: Secures endpoints" },
  { category: "CYBER Assure", class: "Managed XDR", supplier: "Supplier B", code: "CAS-02", buyPrice: 6.50, sellPrice: 12.00, colK: "Functions: Extended detection & response", colL: "Capabilities: 24/7 SOC monitoring", colM: "Customer Benefit: Full-spectrum visibility" },
  { category: "CYBER Assure", class: "Identity Protection", supplier: "Supplier C", code: "CAS-03", buyPrice: 3.20, sellPrice: 6.00, colK: "Functions: Credential monitoring", colL: "Capabilities: Dark web exposure alerts", colM: "Customer Benefit: Prevents identity takeover" },
  { category: "CYBER Assure", class: "Patch Management", supplier: "Supplier C", code: "CAS-04", buyPrice: 2.10, sellPrice: 4.50, colK: "Functions: Automated patching", colL: "Capabilities: OS & 3rd party updates", colM: "Customer Benefit: Closes security vulnerabilities" },
  { category: "CYBER Assure", class: "Email Gateway Security", supplier: "Supplier A", code: "CAS-05", buyPrice: 3.80, sellPrice: 7.50, colK: "Functions: Anti-phishing & spam filter", colL: "Capabilities: Inbound link/attachment analysis", colM: "Customer Benefit: Stops malicious emails" },
  { category: "CYBER Assure", class: "Security Awareness Training", supplier: "Supplier D", code: "CAS-06", buyPrice: 1.80, sellPrice: 3.50, colK: "Functions: Simulated phishing tests", colL: "Capabilities: Automated employee training", colM: "Customer Benefit: Builds human firewall" },
  { category: "CYBER Assure", class: "Device Encryption", supplier: "Supplier B", code: "CAS-07", buyPrice: 1.50, sellPrice: 3.00, colK: "Functions: BitLocker management", colL: "Capabilities: Centralized key management", colM: "Customer Benefit: Protects lost or stolen devices" },
  { category: "CYBER Assure", class: "Mobile Device Management", supplier: "Supplier C", code: "CAS-08", buyPrice: 2.50, sellPrice: 5.00, colK: "Functions: MDM policy enforcement", colL: "Capabilities: Remote wipe & access control", colM: "Customer Benefit: Enforces corporate mobile compliance" },
  { category: "CYBER Assure", class: "Vulnerability Scanner", supplier: "Supplier D", code: "CAS-09", buyPrice: null, sellPrice: 15.00, colK: "Functions: External IP auditing", colL: "Capabilities: Continuous port scanning", colM: "Customer Benefit: Identifies exposed perimeter risks" },
  { category: "CYBER Assure", class: "Zero Trust Network Access", supplier: "Supplier A", code: "CAS-10", buyPrice: 5.00, sellPrice: 9.50, colK: "Functions: Micro-segmentation", colL: "Capabilities: Context-aware access control", colM: "Customer Benefit: Replaces vulnerable VPNs" },

  // CYBER Backup[cite: 1, 3]
  { category: "CYBER Backup", class: "Cloud M365 Backup", supplier: "Supplier B", code: "CB01", buyPrice: 2.00, sellPrice: 4.00, colK: "Functions: Mailbox & SharePoint backup", colL: "Capabilities: Automated daily snapshots", colM: "Customer Benefit: Prevents accidental data loss" },
  { category: "CYBER Backup", class: "Server Cloud Backup", supplier: "Supplier B", code: "CB02", buyPrice: 15.00, sellPrice: 30.00, colK: "Functions: System image backup", colL: "Capabilities: Bare-metal recovery", colM: "Customer Benefit: Fast disaster recovery turnaround" },

  // CYBER Connect[cite: 1, 3]
  { category: "CYBER Connect", class: "Secure Web Gateway", supplier: "Supplier A", code: "CC01", buyPrice: 3.00, sellPrice: 6.00, colK: "Functions: Web content filtering", colL: "Capabilities: Malicious site blocking", colM: "Customer Benefit: Controls web threats and bandwidth" },

  // CYBER Defense[cite: 1, 3]
  { category: "CYBER Defense", class: "MDR SOC Service", supplier: "Supplier D", code: "CDE01", buyPrice: 8.00, sellPrice: 16.00, colK: "Functions: 24/7 Managed SOC", colL: "Capabilities: Active threat isolation", colM: "Customer Benefit: Enterprise security team response" },

  // CYBER Scan[cite: 1, 3]
  { category: "CYBER Scan", class: "External Attack Surface Scan", supplier: "Supplier D", code: "CS01", buyPrice: 20.00, sellPrice: 40.00, colK: "Functions: Perimeter auditing", colL: "Capabilities: Automated vulnerability mapping", colM: "Customer Benefit: Proactive risk identification" }
];

let categories = [];
let currentPageIndex = 0;
let pageDiscounts = {};

document.addEventListener("DOMContentLoaded", () => {
  initApp();
});

function initApp() {
  categories = [...new Set(cpgMasterProducts.map(p => p.category))];
  categories.forEach(cat => pageDiscounts[cat] = 0);
  
  renderAllPages();
  updateStepIndicator();
  updatePageVisibility();
}

function getTotalPages() {
  // Category Pages (6) + Customer Details Page (1) + Summary Page (1) = Total Pages[cite: 1]
  return categories.length + 2; 
}

function renderAllPages() {
  const container = document.getElementById("dynamic-pages-container");
  container.innerHTML = "";

  // 1. Render Product Category Pages First[cite: 1]
  categories.forEach((catName, idx) => {
    const pageDiv = document.createElement("div");
    pageDiv.className = "form-page";
    pageDiv.id = `page-${idx}`;

    const catProducts = cpgMasterProducts.filter(p => p.category === catName);

    let html = `<h2>${catName}</h2>`;
    html += `
      <div class="table-responsive">
        <table class="product-table" id="table_${catName.replace(/\s+/g, '')}">
          <thead>
            <tr>
              <th style="width: 45px; text-align: center;">Select</th>
              <th>Qty</th>
              <th>Protection Classification</th>
              <th>Product Code</th>
              <th>Supplier</th>
              <th>CPG Buy Price</th>
              <th class="sell-price-header">CPG Sell Price (£)</th>
            </tr>
          </thead>
          <tbody>`;

    catProducts.forEach(prod => {
      const tooltip = `${prod.colK} | ${prod.colL} | ${prod.colM}`;
      const isMissingBuy = prod.buyPrice === null || prod.buyPrice === undefined;
      const buyPriceDisplay = isMissingBuy ? "n/a" : `£${prod.buyPrice.toFixed(2)}`;

      html += `
        <tr id="row_${prod.code}">
          <td style="text-align: center;">
            <input type="checkbox" id="chk_${prod.code}" onchange="handleCheckboxToggle('${prod.code}')">
          </td>
          <td>
            <input type="number" min="0" value="0" id="qty_${prod.code}" 
                   ${isMissingBuy ? 'disabled' : ''} 
                   oninput="handleQuantityInput('${prod.code}')">
          </td>
          <td>
            <span class="product-name-hover" title="${tooltip}">${prod.class} ℹ️</span>
          </td>
          <td><strong>${prod.code}</strong></td>
          <td>${prod.supplier}</td>
          <td><input type="text" value="${buyPriceDisplay}" readonly class="readonly-price"></td>
          <td>
            <input type="number" step="0.01" value="${prod.sellPrice.toFixed(2)}" 
                   id="price_${prod.code}" 
                   data-orig-price="${prod.sellPrice}" 
                   onchange="validateCustomPrice(this, '${prod.code}')">
          </td>
        </tr>`;
    });

    html += `</tbody></table></div>`;

    // Page Level Discount Radio Options
    html += `
      <div class="discount-box">
        <p><strong>Page Discount (${catName}):</strong></p>
        <div class="radio-group">
          ${[0, 10, 20, 25, 30, 40, 50].map(val => `
            <label>
              <input type="radio" name="discount_${catName.replace(/\s+/g, '')}" value="${val}" ${val === 0 ? 'checked' : ''} onclick="setPageDiscount('${catName}',${val})"> 
              ${val}%
            </label>
          `).join('')}
        </div>
      </div>`;

    // Navigation Controls
    html += `
      <div class="nav-buttons">
        <button type="button" class="btn btn-prev" ${idx === 0 ? 'style="visibility:hidden;"' : ''} onclick="prevPage()">&larr; Back</button>
        <button type="button" class="btn btn-next" onclick="nextPage()">Next &rarr;</button>
      </div>`;

    pageDiv.innerHTML = html;
    container.appendChild(pageDiv);
  });

  // 2. Render Customer Details Page (Moved to end after Product Sections)[cite: 1]
  const custPageIndex = categories.length;
  const custPage = document.createElement("div");
  custPage.className = "form-page";
  custPage.id = `page-${custPageIndex}`;
  custPage.innerHTML = `
    <h2>Customer Information</h2>
    <button type="button" class="btn btn-test-data" onclick="populateTestData()">⚡ Test Data</button>
    <div class="form-grid">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="cust-company-name" placeholder="Acme Cyber Corp">
      </div>
      <div class="form-group">
        <label>Attention / Contact</label>
        <input type="text" id="cust-attention" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Address Line 1</label>
        <input type="text" id="cust-addr1" placeholder="123 Tech Way">
      </div>
      <div class="form-group">
        <label>Address Line 2</label>
        <input type="text" id="cust-addr2" placeholder="Suite 400">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="cust-city" placeholder="London">
      </div>
      <div class="form-group">
        <label>Postcode</label>
        <input type="text" id="cust-postcode" placeholder="EC1A 1BB">
      </div>
      <div class="form-group">
        <label>Quote Number</label>
        <input type="text" id="quote-number" value="QU-1001">
      </div>
      <div class="form-group">
        <label>Quote Reference</label>
        <input type="text" id="quote-ref" placeholder="Annual Security Renewal">
      </div>
    </div>
    <div class="nav-buttons">
      <button type="button" class="btn btn-prev" onclick="prevPage()">&larr; Back</button>
      <button type="button" class="btn btn-next" onclick="nextPage()">Review Summary &rarr;</button>
    </div>
  `;
  container.appendChild(custPage);

  // 3. Render Summary & PDF Export Page
  const summaryPageIndex = categories.length + 1;
  const summaryPage = document.createElement("div");
  summaryPage.className = "form-page";
  summaryPage.id = `page-${summaryPageIndex}`;
  summaryPage.innerHTML = `
    <h2>Quote Summary</h2>
    <div id="summary-table-container"></div>
    <div class="nav-buttons">
      <button type="button" class="btn btn-prev" onclick="prevPage()">&larr; Back</button>
      <button type="button" class="btn btn-action" onclick="previewPDF()">Preview & Generate PDF</button>
    </div>
  `;
  container.appendChild(summaryPage);
}

function updateStepIndicator() {
  const indicator = document.getElementById("step-indicator");
  let steps = [...categories, "Customer Info", "Summary"];
  
  indicator.innerHTML = steps.map((step, idx) => `
    <div class="step-item ${idx === currentPageIndex ? 'active' : ''}">${step}</div>
  `).join('');
}

function updatePageVisibility() {
  const pages = document.querySelectorAll(".form-page");
  pages.forEach((p, idx) => {
    p.classList.toggle("active-page", idx === currentPageIndex);
  });

  updateStepIndicator();

  // Rebuild summary table when reaching final summary step
  if (currentPageIndex === getTotalPages() - 1) {
    buildSummaryTable();
  }
}

function nextPage() {
  if (currentPageIndex < getTotalPages() - 1) {
    currentPageIndex++;
    updatePageVisibility();
  }
}

function prevPage() {
  if (currentPageIndex > 0) {
    currentPageIndex--;
    updatePageVisibility();
  }
}

// Tick Box & Quantity Dynamics (Decoupled, DOM-preserving)[cite: 1]
function handleQuantityInput(code) {
  const qtyInput = document.getElementById(`qty_${code}`);
  const chkInput = document.getElementById(`chk_${code}`);
  const qtyVal = parseInt(qtyInput.value) || 0;

  // Auto-tick checkbox if Qty > 0[cite: 1]
  if (qtyVal > 0) {
    chkInput.checked = true;
  }

  // Recalculate dynamic prices in-place without table re-render[cite: 1]
  const prod = cpgMasterProducts.find(p => p.code === code);
  if (prod) {
    const pageDisc = pageDiscounts[prod.category] || 0;
    if (pageDisc > 0) {
      updateDiscountCellInPlace(prod.code, prod.category, pageDisc);
    }
  }
}

function handleCheckboxToggle(code) {
  const prod = cpgMasterProducts.find(p => p.code === code);
  if (prod) {
    const pageDisc = pageDiscounts[prod.category] || 0;
    updateDiscountCellInPlace(prod.code, prod.category, pageDisc);
  }
}

// In-Place Dynamic Table Updates (Prevents table flicker/removal)[cite: 1]
function setPageDiscount(category, percentage) {
  pageDiscounts[category] = percentage;
  const safeCat = category.replace(/\s+/g, '');
  const table = document.getElementById(`table_${safeCat}`);
  if (!table) return;

  const headerRow = table.querySelector("thead tr");
  let discHeader = table.querySelector(".disc-price-header");

  if (percentage > 0) {
    // Add red discount header if missing[cite: 1]
    if (!discHeader) {
      discHeader = document.createElement("th");
      discHeader.className = "disc-price-header";
      discHeader.style.color = "var(--discount-red)";
      discHeader.innerText = "CPG Discounted Price (£)";
      
      const sellHeader = headerRow.querySelector(".sell-price-header");
      sellHeader.style.color = "var(--text-muted)";
      headerRow.insertBefore(discHeader, sellHeader.nextSibling);
    }
  } else {
    // Remove discount header if 0%[cite: 1]
    if (discHeader) {
      discHeader.remove();
      const sellHeader = headerRow.querySelector(".sell-price-header");
      sellHeader.style.color = "var(--text-muted)";
    }
  }

  // Update rows in-place[cite: 1]
  const catProducts = cpgMasterProducts.filter(p => p.category === category);
  catProducts.forEach(prod => {
    updateDiscountCellInPlace(prod.code, category, percentage);
  });
}

function updateDiscountCellInPlace(code, category, percentage) {
  const row = document.getElementById(`row_${code}`);
  if (!row) return;

  const chkInput = document.getElementById(`chk_${code}`);
  const priceInput = document.getElementById(`price_${code}`);
  let discTd = row.querySelector(`.disc-td-${code}`);

  if (percentage > 0) {
    if (!discTd) {
      discTd = document.createElement("td");
      discTd.className = `disc-td-${code}`;
      const sellTd = priceInput.closest("td");
      row.insertBefore(discTd, sellTd.nextSibling);
    }

    // Apply discount strictly to checked items[cite: 1]
    if (chkInput && chkInput.checked) {
      const currentSellPrice = parseFloat(priceInput.value) || 0;
      const discountedPrice = currentSellPrice * (1 - (percentage / 100));
      discTd.innerHTML = `<input type="number" step="0.01" value="${discountedPrice.toFixed(2)}" readonly class="readonly-price" style="color: var(--discount-red); font-weight: bold;">`;
    } else {
      discTd.innerHTML = `<span style="color: var(--text-muted);">-</span>`;
    }
  } else {
    if (discTd) {
      discTd.remove();
    }
  }
}

// 50% Max Discount Validation Rule[cite: 1]
function validateCustomPrice(input, code) {
  const origPrice = parseFloat(input.dataset.origPrice);
  const newPrice = parseFloat(input.value) || 0;
  const minAllowedPrice = origPrice * 0.5;

  if (newPrice < minAllowedPrice) {
    alert("Warning: You cannot give more than a 50% discount on the base selling price.");
    input.value = origPrice.toFixed(2);
  }

  const prod = cpgMasterProducts.find(p => p.code === code);
  if (prod) {
    const pageDisc = pageDiscounts[prod.category] || 0;
    updateDiscountCellInPlace(code, prod.category, pageDisc);
  }
}

// Dynamic Summary Calculation[cite: 1]
function buildSummaryTable() {
  const container = document.getElementById("summary-table-container");
  const selectedItems = getSelectedProducts();

  if (selectedItems.length === 0) {
    container.innerHTML = "<p style='color: var(--text-muted);'>No products selected. Please go back and select products with quantities.</p>";
    return;
  }

  let subtotal = 0;
  let html = `
    <div class="table-responsive">
      <table class="summary-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Description / Classification</th>
            <th>Qty</th>
            <th>Unit Price (£)</th>
            <th>Discount</th>
            <th>Amount GBP</th>
          </tr>
        </thead>
        <tbody>`;

  selectedItems.forEach(item => {
    const lineTotal = item.qty * item.finalUnitPrice;
    subtotal += lineTotal;

    html += `
      <tr>
        <td>${item.category}</td>
        <td>${item.description} (${item.code})</td>
        <td>${item.qty}</td>
        <td>£${item.baseUnitPrice.toFixed(2)}</td>
        <td>${item.discount}%</td>
        <td>£${lineTotal.toFixed(2)}</td>
      </tr>`;
  });

  const vat = subtotal * 0.20;
  const total = subtotal + vat;

  html += `
        </tbody>
      </table>
    </div>
    <div class="summary-totals">
      <p><span>Subtotal:</span> <span>£${subtotal.toFixed(2)}</span></p>
      <p><span>VAT (20%):</span> <span>£${vat.toFixed(2)}</span></p>
      <p class="total-row"><span>TOTAL GBP:</span> <span>£${total.toFixed(2)}</span></p>
    </div>
    <div style="clear:both;"></div>`;

  container.innerHTML = html;
}

function getSelectedProducts() {
  const selected = [];
  cpgMasterProducts.forEach(prod => {
    const chkInput = document.getElementById(`chk_${prod.code}`);
    const qtyInput = document.getElementById(`qty_${prod.code}`);
    const priceInput = document.getElementById(`price_${prod.code}`);

    if (chkInput && chkInput.checked) {
      const qty = parseInt(qtyInput.value) || 0;
      const basePrice = parseFloat(priceInput.value) || 0;
      const discPercent = pageDiscounts[prod.category] || 0;
      const finalPrice = basePrice * (1 - (discPercent / 100));

      if (qty > 0) {
        selected.push({
          code: prod.code,
          category: prod.category,
          description: prod.class,
          qty: qty,
          baseUnitPrice: basePrice,
          discount: discPercent,
          finalUnitPrice: finalPrice
        });
      }
    }
  });
  return selected;
}

function previewPDF() {
  document.getElementById("pdf-preview-target").innerHTML = generateQuoteHTML();
  document.getElementById("pdf-modal").style.display = "block";
}

function closeModal() {
  document.getElementById("pdf-modal").style.display = "none";
}

function downloadPDF() {
  const companyName = document.getElementById("cust-company-name").value.trim() || "Customer";
  const quoteNo = document.getElementById("quote-number").value.trim() || "Quote";
  const fileName = `${companyName}_${quoteNo}.pdf`;

  const element = document.createElement("div");
  element.innerHTML = generateQuoteHTML();

  const opt = {
    margin:       10,
    filename:     fileName,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save();
}
